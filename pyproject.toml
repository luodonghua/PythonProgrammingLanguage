[project]
name = "python-programming-language"
version = "0.1.0"
description = "Learn Python 3: topic pages, quizzes and practice assignments."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "pydantic>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "weasyprint>=62",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["modules"]
