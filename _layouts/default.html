<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cheatsheet.css' | relative_url }}">
  <script src="{{ '/assets/js/progress.js' | relative_url }}" defer></script>
  {% if page.kind == "quiz" %}<script src="{{ '/assets/js/quiz.js' | relative_url }}" defer></script>{% endif %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">Python Programming</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Roadmap</a>
      <a href="{{ '/cheatsheets/basic/' | relative_url }}">Basic cheatsheet</a>
      <a href="{{ '/cheatsheets/advanced/' | relative_url }}">Advanced cheatsheet</a>
      <a href="{{ '/glossary/' | relative_url }}">Glossary</a>
      <a href="https://github.com/luodonghua/PythonProgrammingLanguage">GitHub</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    Written for Python 3.14 or later. Progress is saved in your browser only.
  </footer>
</body>
</html>
