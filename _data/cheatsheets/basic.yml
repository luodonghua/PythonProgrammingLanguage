title: Python basics cheatsheet
subtitle: "Python 3.14+ | topics 1-25 | luodonghua.github.io/PythonProgrammingLanguage"
sections:
  - title: Run code
    items:
      - check: none
        code: |
          uv python install 3.14
          uv init myproj && cd myproj
          uv run main.py          # run a script
          uv add httpx            # add a package
          uv run python           # REPL (exit())
          python -c "print(1 + 1)"
  - title: Types and numbers
    items:
      - code: |
          n = 7; f = 2.5; ok = True; nothing = None
          print(7 // 2, 7 % 2, 2 ** 10, divmod(7, 2))
        out: 3 1 1024 (3, 1)
      - code: |
          print(0.1 + 0.2 == 0.3, round(2.675, 2))
          print(int("42") + 1, float("1.5"), str(9))
          print(type(3.0).__name__, isinstance(3, int))
        out: |
          False 2.67
          43 1.5 9
          float True
  - title: Strings
    items:
      - code: |
          s = "Hello, Python"
          print(s[0], s[-1], s[7:], s[::-1])
          print(s.upper(), s.replace("l", "L"))
          print("a,b,c".split(","), "-".join(["x", "y"]))
          print("  pad ".strip(), s.startswith("He"), s.find("Py"))
        out: |
          H n Python nohtyP ,olleH
          HELLO, PYTHON HeLLo, Python
          ['a', 'b', 'c'] x-y
          pad True 7
      - code: |
          name, pi = "Ada", 3.14159
          print(f"{name!r} {pi:.2f} {42:>6} {42:<6}| {1234567:,}")
          print(f"{0.256:.1%} {255:#x} {5:03d}")
        out: |
          'Ada' 3.14     42 42    | 1,234,567
          25.6% 0xff 005
  - title: Lists and tuples
    items:
      - code: |
          xs = [3, 1, 2]
          xs.append(4); xs.extend([5]); xs.insert(0, 9)
          print(xs.copy(), xs.pop(), len(xs))
          print(sorted(xs), xs[1:3])
          a, *rest = xs
          print(a, rest, (1, 2) + (3,))
        out: |
          [9, 3, 1, 2, 4, 5] 5 5
          [1, 2, 3, 4, 9] [3, 1]
          9 [3, 1, 2, 4] (1, 2, 3)
      - code: |
          xs = [1, 2]
          b = xs; c = xs.copy()   # b is the SAME list
          b.append(0); print(xs == b, xs == c)
        out: True False
  - title: Dicts and sets
    items:
      - code: |
          d = {"a": 1, "b": 2}
          d["c"] = 3
          print(d.get("z", 0), list(d), d | {"a": 9})
          for k, v in d.items(): print(k, v, end="; ")
        out: |
          0 ['a', 'b', 'c'] {'a': 9, 'b': 2, 'c': 3}
          a 1; b 2; c 3;
      - code: |
          from collections import Counter, defaultdict
          print(Counter("banana").most_common(2))
          g = defaultdict(list); g["x"].append(1); print(dict(g))
          print({1, 2, 3} & {2, 3, 4}, {1, 2} | {2, 5}, {1, 2} - {2})
        out: |
          [('a', 3), ('n', 2)]
          {'x': [1]}
          {2, 3} {1, 2, 5} {1}
  - title: Conditions and match
    items:
      - code: |
          x = 15
          if x % 15 == 0: r = "both"
          elif x % 3 == 0: r = "three"
          else: r = "none"
          print(r, "big" if x > 10 else "small", 1 < x < 20)
          print(0 or "dflt", "a" and "b", None is None)
        out: |
          both big True
          dflt b True
      - code: |
          def show(cmd):
              match cmd.split():
                  case ["go", d] if d in {"n", "s"}: return f"go {d}"
                  case ["take", first, *more]: return f"take {first}+{len(more)}"
                  case [] | ["quit"]: return "stop"
                  case _: return "?"
          print(show("go n"), show("take a b c"), show(""), show("x"))
        out: go n take a+2 stop ?
  - title: Loops and comprehensions
    items:
      - code: |
          for i, ch in enumerate("ab", start=1): print(i, ch, end=" | ")
          for a, b in zip([1, 2], "xy"): print(a, b, end=" | ")
          n = 0
          while n < 3: n += 1
          for i in range(10):
              if i == 2: break
          else: print("no break")
        out: 1 a | 2 b | 1 x | 2 y |
      - code: |
          sq = [x * x for x in range(5) if x % 2 == 0]
          dd = {w: len(w) for w in ["hi", "there"]}
          print(sq, dd, sorted({c for c in "aab"}), sum(x for x in range(4)))
        out: "[0, 4, 16] {'hi': 2, 'there': 5} ['a', 'b'] 6"
  - title: Functions
    items:
      - code: |
          def f(a, b=2, *args, key=None, **kw):
              """Docstring."""
              return a + b, args, key, kw
          print(f(1), f(1, 5, 6, key="k", z=0))
          def g(x, /, y, *, z): return x + y + z
          print(g(1, 2, z=3), (lambda t: t * 2)(4))
        out: |
          (3, (), None, {}) (6, (6,), 'k', {'z': 0})
          6 8
      - code: |
          def bad(x, acc=[]): acc.append(x); return acc   # BUG
          def ok(x, acc=None):
              acc = [] if acc is None else acc
              acc.append(x); return acc
          print(bad(1), bad(2), ok(1), ok(2))
        out: "[1, 2] [1, 2] [1] [2]"
  - title: Files and paths
    items:
      - code: |
          from pathlib import Path
          import tempfile
          p = Path(tempfile.mkdtemp()) / "a.txt"
          p.write_text("one\ntwo\n", encoding="utf-8")
          print(p.suffix, p.stem, p.exists(), p.read_text().splitlines())
          with p.open(encoding="utf-8") as fh:
              for line in fh: print(line.strip(), end=" ")
        out: |
          .txt a True ['one', 'two']
          one two
      - check: none
        code: |
          Path("out").mkdir(parents=True, exist_ok=True)
          sorted(Path(".").glob("*.py"))     # list files
          open("f.txt", "a")   # modes: r w a x  + b
  - title: Errors
    items:
      - code: |
          class AppError(Exception): pass
          def parse(s):
              try:
                  return int(s)
              except ValueError as e:
                  raise AppError(f"bad {s!r}") from e
              finally:
                  print("done", end=" ")
          print(parse("7"))
          try: parse("x")
          except AppError as e: print(e, type(e.__cause__).__name__)
        out: |
          done 7
          done bad 'x' ValueError
  - title: Classes
    items:
      - code: |
          from dataclasses import dataclass
          class Dog:
              sound = "woof"                  # class attribute
              def __init__(self, name): self.name = name
              def __repr__(self): return f"Dog({self.name!r})"
              @property
              def shout(self): return self.sound.upper()
              @classmethod
              def pup(cls): return cls("pup")
          class Puppy(Dog):
              def __init__(self, n): super().__init__(n + "!")
          print(Dog.pup(), Puppy("rex"), Dog("a").shout)
        out: Dog('pup') Dog('rex!') WOOF
      - code: |
          from dataclasses import dataclass
          @dataclass(frozen=True, order=True)
          class P: x: int; y: int = 0
          print(P(1), P(1) < P(2), P(1) == P(1, 0))
        out: P(x=1, y=0) True True
  - title: Imports and stdlib
    items:
      - code: |
          import math, random, statistics as st
          from itertools import islice, pairwise
          random.seed(1)
          print(math.sqrt(16), st.mean([1, 2, 6]), list(pairwise("abc")))
          if __name__ == "__main__": print("run as script")
        out: |
          4.0 3 [('a', 'b'), ('b', 'c')]
          run as script
  - title: Type hints
    items:
      - code: |
          def first[T](xs: list[T], default: T | None = None) -> T | None:
              return xs[0] if xs else default
          from typing import Callable, Literal, TypedDict
          print(first([3, 4]), first([], 0))
        out: 3 0
  - title: Text data
    items:
      - code: |
          import csv, io, json, re
          rows = list(csv.DictReader(io.StringIO("a,b\n1,2\n")))
          print(rows, json.dumps({"k": [1, None]}), json.loads("[1]"))
          m = re.search(r"(?P<y>\d{4})-(\d\d)", "on 2026-11-15")
          print(m["y"], m.group(2), re.findall(r"\d+", "a1b22"), re.sub(r"\s+", " ", "a   b"))
        out: |
          [{'a': '1', 'b': '2'}] {"k": [1, null]} [1]
          2026 11 ['1', '22'] a b
  - title: Dates
    items:
      - code: |
          from datetime import date, datetime, timedelta, UTC
          from zoneinfo import ZoneInfo
          d = date(2026, 11, 15)
          print(d + timedelta(days=20), d.strftime("%a %d %b %Y"), d.isoformat())
          t = datetime(2026, 1, 1, 12, tzinfo=UTC)
          print(t.astimezone(ZoneInfo("Asia/Singapore")).isoformat())
          print(datetime.strptime("2026-03-04", "%Y-%m-%d").date())
        out: |
          2026-12-05 Sun 15 Nov 2026 2026-11-15
          2026-01-01T20:00:00+08:00
          2026-03-04
  - title: SQLite
    items:
      - code: |
          import sqlite3
          db = sqlite3.connect(":memory:"); db.row_factory = sqlite3.Row
          db.execute("CREATE TABLE t (id INTEGER PRIMARY KEY, n TEXT)")
          db.execute("INSERT INTO t (n) VALUES (?)", ("ann",))   # ? = safe
          db.commit()
          print(dict(db.execute("SELECT * FROM t WHERE n = ?", ("ann",)).fetchone()))
        out: "{'id': 1, 'n': 'ann'}"
  - title: PostgreSQL (psycopg 3)
    items:
      - check: none
        code: |
          docker compose up -d        # compose.yaml in repo
          import psycopg
          with psycopg.connect(dsn) as conn:    # commit on exit
              cur = conn.execute(
                  "INSERT INTO t (n) VALUES (%s) RETURNING id",
                  ("ann",))                      # %s, never f-strings
              new_id = cur.fetchone()[0]
              with conn.transaction():           # all or nothing
                  conn.execute("UPDATE t SET n = %s WHERE id = %s", ("bo", new_id))
  - title: Concurrency
    items:
      - code: |
          from concurrent.futures import ThreadPoolExecutor
          import threading
          with ThreadPoolExecutor(4) as pool:
              print(list(pool.map(lambda x: x * 2, [1, 2, 3])))
          lock, total = threading.Lock(), 0
          with lock: total += 1
          print(total)
        out: |
          [2, 4, 6]
          1
  - title: HTTP and data
    items:
      - code: |
          from urllib.parse import urlencode, urlparse
          print(urlencode({"q": "a b", "n": 1}), urlparse("https://x.org/p?a=1").netloc)
        out: q=a+b&n=1 x.org
      - check: none
        code: |
          import pandas as pd
          df = pd.read_csv("data.csv")
          df[df.age > 30].groupby("city")["pay"].mean()
          df.sort_values("pay", ascending=False).head(3)
