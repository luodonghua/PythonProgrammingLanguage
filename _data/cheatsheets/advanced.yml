  - title: Agent loop skeleton
    items:
      - code: |
          import asyncio, json
          TOOLS = {"add": lambda a, b: a + b}
          class FakeModel:                     # scripted replies, no API
              def __init__(self, replies): self.replies = iter(replies)
              async def __call__(self, msgs): return next(self.replies)
          async def agent(model, question, max_steps=5):
              msgs = [{"role": "user", "content": question}]
              for _ in range(max_steps):
                  reply = await model(msgs); msgs.append(reply)
                  if not reply.get("tool_calls"): return reply["content"]
                  for c in reply["tool_calls"]:
                      try: out = TOOLS[c["name"]](**json.loads(c["arguments"]))
                      except Exception as e: out = f"error: {e}"
                      msgs.append({"role": "tool", "tool_call_id": c["id"], "content": str(out)})
              return "step limit"
          m = FakeModel([
              {"tool_calls": [{"id": "1", "name": "add", "arguments": '{"a": 2, "b": 3}'}]},
              {"content": "5"}])
          print(asyncio.run(agent(m, "2+3?")))
        out: "5"
