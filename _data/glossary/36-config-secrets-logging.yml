- {term: Environment variable, meaning: "A named text setting that the operating system passes to a program. In Python, read it with os.environ."}
- {term: .env file, meaning: "A text file of NAME=value lines that holds settings for one machine. It is kept out of git."}
- {term: Secret, meaning: "A value that grants access, such as an API key or password. It must never appear in code, logs or error messages."}
- {term: Log level, meaning: "The importance of a log record: DEBUG, INFO, WARNING, ERROR or CRITICAL. Records below the logger's level are dropped."}
- {term: Handler, meaning: "A logging object that sends records to a destination such as the console or a file."}
- {term: Filter (logging), meaning: "An object that can change a log record or drop it before it is formatted. It can add fields such as a trace id."}
- {term: Trace id, meaning: "An identifier put on every log line of one request or job, so the lines can be found together."}
