- q: |
    What is the output?

    ```python
    print(list(range(2, 10, 3)))
    ```
  options:
    - "`[2, 5, 8, 11]`"
    - "`[3, 6, 9]`"
    - "`[2, 5, 8]`"
    - "`[2, 3, 4, 5, 6, 7, 8, 9]`"
  answer: C
  why: |
    The loop starts at 2 and adds 3 each time: 2, 5, 8. The next value, 11, is not below the stop value 10, so it is left out.

- q: |
    What is the output?

    ```python
    for n in [1, 3, 5]:
        if n % 2 == 0:
            print("even", n)
            break
    else:
        print("all odd")
    ```
  options:
    - "`all odd`"
    - "`even 1`"
    - "Nothing is printed."
    - "`even 3`"
  answer: A
  why: |
    No number is even, so `break` never runs. A loop's `else` block runs when the loop ends without `break`, so `all odd` is printed.

- q: |
    What is the output?

    ```python
    total = 0
    for i, letter in enumerate(["a", "b", "c"], start=1):
        total += i
    print(total)
    ```
  options:
    - "`3`"
    - "`abc`"
    - "`0`"
    - "`6`"
  answer: D
  why: |
    `enumerate(..., start=1)` numbers the items 1, 2 and 3. The loop adds the numbers, not the letters: 1 + 2 + 3 = 6. With the default start of 0 the total would be 3.

- q: |
    How many numbers does `range(1, 5)` produce?
  options:
    - "`5`"
    - "`4`"
    - "`6`"
    - "`3`"
  answer: B
  why: |
    `range(1, 5)` gives 1, 2, 3, 4. The start is included and the stop is excluded, so the length is `stop - start`.

- q: |
    What is the output?

    ```python
    out = []
    for n in range(1, 8):
        if n % 3 == 0:
            continue
        if n > 5:
            break
        out.append(n)
    print(out)
    ```
  options:
    - "`[1, 2, 4, 5, 7]`"
    - "`[1, 2, 3, 4, 5]`"
    - "`[1, 2, 4, 5]`"
    - "`[1, 2]`"
  answer: C
  why: |
    `continue` skips 3. At 6, `continue` also runs first (6 % 3 == 0), so the loop moves on to 7. Then `7 > 5` triggers `break`. The list holds 1, 2, 4, 5.

- q: |
    What is the output?

    ```python
    for i in range(3):
        pass
    print(i)
    ```
  options:
    - "`2`"
    - "`3`"
    - "`NameError`"
    - "`0`"
  answer: A
  why: |
    A loop variable stays alive after the loop and keeps the last value it had. The last value from `range(3)` is 2.

- q: |
    What is printed?

    ```python
    print(len(list(zip([1, 2, 3], "ab"))))
    ```
  options:
    - "`3`"
    - "`5`"
    - "A `ValueError`, because the lengths differ."
    - "`2`"
  answer: D
  why: |
    `zip` stops when the shortest input runs out. It makes the pairs `(1, 'a')` and `(2, 'b')` and ignores the 3. It does not raise an error for different lengths.

- q: |
    What is the output?

    ```python
    n = 10
    steps = 0
    while n > 1:
        n //= 2
        steps += 1
    print(steps, n)
    ```
  options:
    - "`4 0`"
    - "`3 1`"
    - "`5 1`"
    - "`10 1`"
  answer: B
  why: |
    `n` goes 10, 5, 2, 1. That is three halvings (`//` rounds down), and then `n > 1` is false. So `steps` is 3 and `n` is 1.

- q: |
    How many times does `count += 1` run?

    ```python
    count = 0
    for i in range(3):
        for j in range(i):
            count += 1
    ```
  options:
    - "`9`"
    - "`6`"
    - "`3`"
    - "`2`"
  answer: C
  why: |
    The inner loop runs `i` times for each `i`. For `i` = 0, 1 and 2 that is 0 + 1 + 2 = 3 times.

- q: |
    Which loop never ends?
  options:
    - "`n = 5` then `while n > 0: print(n)`"
    - "`for n in range(5): print(n)`"
    - "`n = 5` then `while n > 0: n -= 1`"
    - "`for ch in \"abc\": print(ch)`"
  answer: A
  why: |
    In the first loop nothing changes `n`, so `n > 0` stays true forever. The other loops either run over a finite sequence or move the condition toward false.
