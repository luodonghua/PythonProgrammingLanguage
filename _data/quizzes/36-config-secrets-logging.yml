- q: |
    What is the type of `os.environ["PORT"]` when the shell has set `PORT=8080`?
  options:
    - "`int`, because the value looks like a number."
    - "`bytes`."
    - "`str`. Every environment value is a string."
    - "It depends on the operating system."
  answer: C
  why: |
    Environment variables are text. Python never guesses a type, so you convert with `int(...)` yourself and decide what happens on invalid input.

- q: |
    What is the output?

    ```python
    env = {"PORT": "80", "DEBUG": "false"}
    print(int(env["PORT"]) + 1, bool(env["DEBUG"]))
    ```
  options:
    - "`81 True`"
    - "`801 True`"
    - "`81 False`"
    - "`TypeError`"
  answer: A
  why: |
    `int("80") + 1` is 81. `bool("false")` is `True`, because any non-empty string is truthy. To read a flag, compare the text with words such as `"true"` and `"false"`.

- q: |
    Why is `load_config(env)` better when `env` is a parameter than when the function reads `os.environ` directly?
  options:
    - "It runs faster."
    - "It makes the settings secret."
    - "`os.environ` cannot be read inside a function."
    - "A test can pass a plain dict, so it needs no changes to the real environment."
  answer: D
  why: |
    Taking the mapping as an argument is dependency injection. The production code passes `os.environ`, and tests pass a dict. Nothing global is modified.

- q: |
    What is the output?

    ```python
    from dataclasses import dataclass, field


    @dataclass(frozen=True)
    class Config:
        api_key: str = field(repr=False)
        port: int = 8000


    print(Config("sk-abc", 9000))
    ```
  options:
    - "`Config(api_key='sk-abc', port=9000)`"
    - "`Config(port=9000)`"
    - "`Config(api_key='****', port=9000)`"
    - "`FrozenInstanceError`"
  answer: B
  why: |
    `field(repr=False)` leaves the field out of the generated `__repr__`. Nothing is changed or raised: `frozen=True` only matters when you try to assign to a field later.

- q: |
    A config loader finds three invalid variables. What is the most helpful behaviour?
  options:
    - "Collect all three problems and raise one error that lists them."
    - "Replace each invalid value with its default and carry on silently."
    - "Raise an error for the first one and stop."
    - "Log the problems and start the program anyway."
  answer: A
  why: |
    Reporting all problems together lets the user fix the whole setup in one go. Silent defaults hide mistakes, and starting with invalid settings moves the failure to a worse moment.

- q: |
    Which statement about secrets is correct?
  options:
    - "A key that was committed to git is safe after you delete the file in a new commit."
    - "Logging a secret is fine if the log file is private."
    - "A secret that was exposed should be rotated, because old commits and copies still contain it."
    - "A short secret is safe to show half of."
  answer: C
  why: |
    Git keeps history, and anyone who cloned or read the log may have the value. The fix is a new secret and disabling the old one. Showing half of a short secret leaks too much of it, and private logs still spread to backups and tools.

- q: |
    A logger is set to `INFO`. Which calls produce output?

    ```python
    log.debug("a")
    log.info("b")
    log.warning("c")
    ```
  options:
    - "Only `b`."
    - "`b` and `c`."
    - "Only `c`."
    - "`a`, `b` and `c`."
  answer: B
  why: |
    A logger passes records at its level or higher. The order is DEBUG (10), INFO (20), WARNING (30), so `b` and `c` pass and `a` is dropped.

- q: |
    What is the output?

    ```python
    import logging
    import sys

    logging.basicConfig(stream=sys.stdout, level=logging.WARNING, format="%(levelname)s:%(message)s")
    logging.getLogger("app").info("one")
    logging.getLogger("app").warning("two %s", 2)
    logging.getLogger("app.db").error("three")
    ```
  options:
    - "Nothing, because the loggers have no handlers."
    - "Three lines: `INFO:one`, `WARNING:two 2` and `ERROR:three`."
    - "One line: `WARNING:two 2`."
    - "Two lines: `WARNING:two 2` and `ERROR:three`."
  answer: D
  why: |
    `basicConfig` sets the root logger to `WARNING` with a console handler. The child loggers `app` and `app.db` have no level of their own, so they use the root level, and their records travel up to the root handler. `info` is below `WARNING`.

- q: |
    Why call `log.info("user=%s", user)` instead of `log.info(f"user={user}")`?
  options:
    - "The `%s` version formats the text only when the record is actually emitted, and handlers and filters still see the arguments."
    - "The f-string version is a `SyntaxError` in logging calls."
    - "The `%s` version encrypts the value."
    - "The f-string version cannot contain a variable."
  answer: A
  why: |
    With arguments, `logging` does the formatting late, so a record below the level costs almost nothing. The f-string always does the work, even for a message that is dropped.

- q: |
    A web service handles 100 requests at the same time with asyncio. How do you put each request's id on its own log lines?
  options:
    - "Store the id in a global variable that each request overwrites."
    - "Store the id in a class attribute of the logger."
    - "Store the id in a `ContextVar` and copy it onto each record with a logging filter."
    - "Print the id with `print` before every log call."
  answer: C
  why: |
    A global variable is shared, so requests overwrite each other's ids. A `ContextVar` has a separate value per asyncio task, and a filter reads the current value at the moment a record is created.
