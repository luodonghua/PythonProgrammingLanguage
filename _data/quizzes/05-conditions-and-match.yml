- q: |
    Which value is **truthy** (an `if` treats it as true)?
  options:
    - "`\"\"` (empty string)"
    - "`0.0`"
    - "`[]`"
    - "`\"0\"` (a string with one character)"
  answer: D
  why: |
    Falsy values are `False`, `None`, zero of any numeric type, and empty containers or strings. `"0"` is a non-empty string, so it is truthy.

- q: |
    What is the output?

    ```python
    print(1 < 5 < 3)
    ```
  options:
    - "`True`"
    - "`False`"
    - "`SyntaxError`"
    - "`None`"
  answer: B
  why: |
    A chained comparison means `1 < 5 and 5 < 3`. The first part is true and the second is false, so the result is `False`.

- q: |
    What is the recommended way to test whether `x` is `None`?
  options:
    - "`if x is None:`"
    - "`if x == None:`"
    - "`if x = None:`"
    - "`if not None x:`"
  answer: A
  why: |
    `None` is a single object, so use the identity test `is None`. A single `=` is assignment and is a `SyntaxError` inside an `if` condition.

- q: |
    What is printed?

    ```python
    n = 15
    if n % 3 == 0:
        print("A")
    elif n % 5 == 0:
        print("B")
    else:
        print("C")
    ```
  options:
    - "`A` then `B`"
    - "`B`"
    - "`A`"
    - "`C`"
  answer: C
  why: |
    `15 % 3 == 0` is true, so the first branch runs. Python skips every `elif` and `else` after a branch has run. This is why FizzBuzz must test "divisible by both" first.

- q: |
    What is the output?

    ```python
    print(0 or "default")
    ```
  options:
    - "`True`"
    - "`default`"
    - "`0`"
    - "`False`"
  answer: B
  why: |
    `or` returns the first truthy operand (or the last operand if none is truthy), not just `True` or `False`. `0` is falsy, so the result is `"default"`.

- q: |
    What is the output?

    ```python
    age = 20
    label = "adult" if age >= 18 else "minor"
    print(label)
    ```
  options:
    - "`adult`"
    - "`minor`"
    - "`True`"
    - "`SyntaxError`"
  answer: A
  why: |
    `A if condition else B` is a conditional expression. It evaluates to `A` when the condition is true, otherwise `B`.

- q: |
    In a `match` statement, what does `case _:` do?
  options:
    - "Matches only the value `_`"
    - "Matches only `None`"
    - "Raises an error because `_` is invalid"
    - "Matches anything, and does not bind a name"
  answer: D
  why: |
    `_` is the wildcard pattern. Put it last as the default case. A bare name such as `case ok:` is different: it captures the value and matches anything, and Python rejects it if more cases follow (`name capture 'ok' makes remaining patterns unreachable`).

- q: |
    What does `case 4 | 6 | 9 | 11:` mean?
  options:
    - "The bitwise OR of 4, 6, 9 and 11"
    - "Match only if the subject is all four values at once"
    - "Match if the subject is any one of those four values"
    - "A syntax error. Only one value is allowed."
  answer: C
  why: |
    In a pattern, `|` separates alternatives (an or-pattern). It is not the bitwise operator.

- q: |
    What happens here when `n` is `3`?

    ```python
    match n:
        case x if x > 10:
            print("big")
        case x:
            print("small")
    ```
  options:
    - "`small`"
    - "`big`"
    - "Nothing is printed"
    - "A `SyntaxError`"
  answer: A
  why: |
    A guard (`if x > 10`) adds an extra condition to a case. For `n = 3` it is false, so Python moves to the next case. `case x:` is last, so a capture pattern is allowed there and matches anything.

- q: |
    What is the output?

    ```python
    match [1, 2, 3]:
        case [first, *rest]:
            print(first, rest)
    ```
  options:
    - "`1 2 3`"
    - "`1 [2, 3]`"
    - "`[1] [2, 3]`"
    - "Nothing, because the pattern has fewer items than the list"
  answer: B
  why: |
    A sequence pattern matches a list or tuple by position. `first` binds the first item and `*rest` collects the remaining items into a list, so `rest` is `[2, 3]`.
