name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    # 3.15 may still be a pre-release, so it must not block the build.
    continue-on-error: ${{ matrix.python == '3.15' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: uv sync --python ${{ matrix.python }}
      - name: Check site content (quizzes, assignments, Liquid safety)
        run: uv run python scripts/check_site.py
      - name: Cheatsheet snippets produce the printed output
        run: uv run python scripts/build_cheatsheets.py --check
      - name: Published solutions pass their tests
        run: uv run pytest
        env:
          PRACTICE_TARGET: solution
          PRACTICE_REQUIRE_PG: "1"
